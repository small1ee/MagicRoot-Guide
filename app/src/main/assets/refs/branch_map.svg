<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1420" viewBox="0 0 1760 1420" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
<rect width="1760" height="1420" fill="#0f1420"/>
<text x="40" y="62" fill="#ffffff" font-size="34" font-weight="bold">su 管理器选型决策图</text>
<text x="40" y="96" fill="#8b95a8" font-size="18">从上往下回答三个问题，落到具体分支；右侧是该分支「装完必做的第一步」</text>
<line x1="40" y1="112" x2="1720" y2="112" stroke="#2a3348" stroke-width="2"/>
<rect x="60" y="140" width="620" height="46" rx="23" fill="#1b2434" stroke="#7c3aed" stroke-width="1.6"/>
<text x="370.0" y="170" fill="#e2e8f0" font-size="19" text-anchor="middle">Q1  你的机器能解锁 BL 吗？</text>
<path d="M 370 186 L 370 216" stroke="#4a5468" stroke-width="2.4" fill="none"/>
<path d="M 370 216 l -7 -11 l 14 0 z" fill="#4a5468"/>
<text x="230" y="248" fill="#34d399" font-size="18" font-weight="bold">能解锁</text>
<text x="520" y="248" fill="#f87171" font-size="18" font-weight="bold">不能（荣耀/华为等）</text>
<path d="M 230 258 L 230 286" stroke="#4a5468" stroke-width="2.4" fill="none"/>
<path d="M 230 286 l -7 -11 l 14 0 z" fill="#4a5468"/>
<path d="M 630 258 L 630 286" stroke="#4a5468" stroke-width="2.4" fill="none"/>
<path d="M 630 286 l -7 -11 l 14 0 z" fill="#4a5468"/>
<rect x="470" y="286" width="320" height="150" rx="12" fill="#161d2c" stroke="#f87171" stroke-width="1.8"/>
<rect x="470" y="286" width="320" height="5" rx="2.5" fill="#f87171"/>
<text x="490" y="320" fill="#f87171" font-size="20" font-weight="bold">临时 root（漏洞提权）</text>
<text x="490" y="348" fill="#cdd6e4" font-size="15">是「手段」，不是分支</text>
<text x="490" y="372" fill="#cdd6e4" font-size="15">分支由内核 .ko 决定</text>
<text x="490" y="396" fill="#cdd6e4" font-size="15">只能 soft-reboot，重启归零</text>
<text x="490" y="422" fill="#8b95a8" font-size="14.5">8E5：链路只给 KSU 系载荷</text>
<path d="M 630 436 L 630 470" stroke="#4a5468" stroke-width="2.4" fill="none"/>
<path d="M 630 470 l -7 -11 l 14 0 z" fill="#4a5468"/>
<rect x="470" y="470" width="320" height="128" rx="12" fill="#161d2c" stroke="#f59e0b" stroke-width="1.8"/>
<rect x="470" y="470" width="320" height="5" rx="2.5" fill="#f59e0b"/>
<text x="490" y="504" fill="#f59e0b" font-size="20" font-weight="bold">假回锁（长期用这条）</text>
<text x="490" y="532" fill="#cdd6e4" font-size="15">BL 外观仍 locked，root 持久</text>
<text x="490" y="556" fill="#cdd6e4" font-size="15">装与内核同分支的管理器</text>
<text x="490" y="582" fill="#8b95a8" font-size="14.5">8E5：方案支持，本机未验证</text>
<rect x="60" y="300" width="340" height="46" rx="23" fill="#1b2434" stroke="#7c3aed" stroke-width="1.6"/>
<text x="230.0" y="330" fill="#e2e8f0" font-size="19" text-anchor="middle">Q2  你主要想要什么？</text>
<path d="M 230 346 L 230 376" stroke="#4a5468" stroke-width="2.4" fill="none"/>
<path d="M 230 376 l -7 -11 l 14 0 z" fill="#4a5468"/>
<rect x="60" y="386" width="400" height="52" rx="10" fill="#161d2c" stroke="#3b82f6" stroke-width="1.6"/>
<text x="80" y="410" fill="#e2e8f0" font-size="17.5">最省心 / 资料最多</text>
<text x="80" y="430" fill="#3b82f6" font-size="17" font-weight="bold">→ Magisk 官方</text>
<rect x="60" y="448" width="400" height="52" rx="10" fill="#161d2c" stroke="#22c55e" stroke-width="1.6"/>
<text x="80" y="472" fill="#e2e8f0" font-size="17.5">内核级 + 想少管事</text>
<text x="80" y="492" fill="#22c55e" font-size="17" font-weight="bold">→ KernelSU-Next / SukiSU</text>
<rect x="60" y="510" width="400" height="52" rx="10" fill="#161d2c" stroke="#a855f7" stroke-width="1.6"/>
<text x="80" y="534" fill="#e2e8f0" font-size="17.5">要 KPM 内核模块</text>
<text x="80" y="554" fill="#a855f7" font-size="17" font-weight="bold">→ SukiSU / BakaSU / APatch</text>
<rect x="60" y="572" width="400" height="52" rx="10" fill="#161d2c" stroke="#f59e0b" stroke-width="1.6"/>
<text x="80" y="596" fill="#e2e8f0" font-size="17.5">想一次装完（全家桶）</text>
<text x="80" y="616" fill="#f59e0b" font-size="17" font-weight="bold">→ FinaSU</text>
<rect x="800" y="140" width="920" height="1220" rx="16" fill="#131a27" stroke="#2a3348" stroke-width="1.6"/>
<text x="826" y="180" fill="#ffffff" font-size="22" font-weight="bold">选完之后，必做的第一步（漏了 = 白装）</text>
<rect x="826" y="214" width="868" height="112" rx="12" fill="#161d2c" stroke="#3b82f6" stroke-width="1.5"/>
<rect x="826" y="214" width="6" height="112" rx="3" fill="#3b82f6"/>
<text x="848" y="246" fill="#3b82f6" font-size="19" font-weight="bold">Magisk 官方</text>
<text x="848" y="276" fill="#cdd6e4" font-size="16.5">设置里打开 Zygisk → 装 Zygisk Assistant（要隐藏时）</text>
<text x="848" y="304" fill="#8b95a8" font-size="15.5">⚠ 不需要元模块</text>
<rect x="826" y="338" width="868" height="112" rx="12" fill="#161d2c" stroke="#2563eb" stroke-width="1.5"/>
<rect x="826" y="338" width="6" height="112" rx="3" fill="#2563eb"/>
<text x="848" y="370" fill="#2563eb" font-size="19" font-weight="bold">KernelSU 官方</text>
<text x="848" y="400" fill="#cdd6e4" font-size="16.5">① 装 meta-overlayfs 元模块 → ② 装 Zygisk Next</text>
<text x="848" y="428" fill="#8b95a8" font-size="15.5">⚠ 不装元模块 = 模块全部静默失效</text>
<rect x="826" y="462" width="868" height="112" rx="12" fill="#161d2c" stroke="#22c55e" stroke-width="1.5"/>
<rect x="826" y="462" width="6" height="112" rx="3" fill="#22c55e"/>
<text x="848" y="494" fill="#22c55e" font-size="19" font-weight="bold">KernelSU-Next</text>
<text x="848" y="524" fill="#cdd6e4" font-size="16.5">直接装 Zygisk Next（挂载引擎自带，跳过元模块）</text>
<text x="848" y="552" fill="#8b95a8" font-size="15.5">⚠ —</text>
<rect x="826" y="586" width="868" height="112" rx="12" fill="#161d2c" stroke="#16a34a" stroke-width="1.5"/>
<rect x="826" y="586" width="6" height="112" rx="3" fill="#16a34a"/>
<text x="848" y="618" fill="#16a34a" font-size="19" font-weight="bold">SukiSU-Ultra</text>
<text x="848" y="648" fill="#cdd6e4" font-size="16.5">装 Zygisk Next → 之后才是功能模块；KPM/SUSFS 可用</text>
<text x="848" y="676" fill="#8b95a8" font-size="15.5">⚠ SUSFS 需内核打过补丁</text>
<rect x="826" y="710" width="868" height="112" rx="12" fill="#161d2c" stroke="#a855f7" stroke-width="1.5"/>
<rect x="826" y="710" width="6" height="112" rx="3" fill="#a855f7"/>
<text x="848" y="742" fill="#a855f7" font-size="19" font-weight="bold">BakaSU</text>
<text x="848" y="772" fill="#cdd6e4" font-size="16.5">① 装元模块 → ② 装 Zygisk Next；支持 KPM</text>
<text x="848" y="800" fill="#8b95a8" font-size="15.5">⚠ Tag 多为 pre-release，别追最新</text>
<rect x="826" y="834" width="868" height="112" rx="12" fill="#161d2c" stroke="#f59e0b" stroke-width="1.5"/>
<rect x="826" y="834" width="6" height="112" rx="3" fill="#f59e0b"/>
<text x="848" y="866" fill="#f59e0b" font-size="19" font-weight="bold">APatch</text>
<text x="848" y="896" fill="#cdd6e4" font-size="16.5">设好 SuperKey（忘了进不去）→ 装 APM 模块；支持 KPM</text>
<text x="848" y="924" fill="#8b95a8" font-size="15.5">⚠ 不支持 SUSFS</text>
<rect x="826" y="958" width="868" height="112" rx="12" fill="#161d2c" stroke="#fbbf24" stroke-width="1.5"/>
<rect x="826" y="958" width="6" height="112" rx="3" fill="#fbbf24"/>
<text x="848" y="990" fill="#fbbf24" font-size="19" font-weight="bold">FinaSU</text>
<text x="848" y="1020" fill="#cdd6e4" font-size="16.5">① 确认挂载后端（默认 automatic）→ ② 白名单加 App</text>
<text x="848" y="1048" fill="#8b95a8" font-size="15.5">⚠ 内置 FolkZygisk/Sui，别再装 ZN/Shizuku</text>
<rect x="826" y="1082" width="868" height="112" rx="12" fill="#161d2c" stroke="#f87171" stroke-width="1.5"/>
<rect x="826" y="1082" width="6" height="112" rx="3" fill="#f87171"/>
<text x="848" y="1114" fill="#f87171" font-size="19" font-weight="bold">临时 root（不是分支）</text>
<text x="848" y="1144" fill="#cdd6e4" font-size="16.5">提权 → 按内核 .ko 认分支 → 装模块 → ksud soft-reboot</text>
<text x="848" y="1172" fill="#8b95a8" font-size="15.5">⚠ 每次开机重来；载荷由提权链决定，Magisk/APatch 无方案</text>
<rect x="60" y="660" width="700" height="270" rx="14" fill="#131a27" stroke="#2a3348" stroke-width="1.6"/>
<text x="84" y="700" fill="#ffffff" font-size="20" font-weight="bold">不确定自己在用哪家？30 秒测出来</text>
<text x="84" y="730" fill="#8b95a8" font-size="15">管理器包名不可靠：FinaSU 实测是 me.yuki.fina，也有构建沿用 com.resukisu.resukisu</text>
<text x="84" y="768" fill="#34d399" font-size="16.5" font-family="ui-monospace, Menlo, monospace">su -c "ksud -V"</text>
<text x="420" y="768" fill="#cdd6e4" font-size="16">→ KernelSU 系</text>
<text x="84" y="802" fill="#34d399" font-size="16.5" font-family="ui-monospace, Menlo, monospace">su -c "ls /data/adb/ksu/bin"</text>
<text x="420" y="802" fill="#cdd6e4" font-size="16">有 folkzygisk → FinaSU</text>
<text x="84" y="836" fill="#34d399" font-size="16.5" font-family="ui-monospace, Menlo, monospace">su -c "ls /data/adb/magisk"</text>
<text x="420" y="836" fill="#cdd6e4" font-size="16">有 magisk → Magisk 系</text>
<text x="84" y="870" fill="#34d399" font-size="16.5" font-family="ui-monospace, Menlo, monospace">su -c "ls /data/adb/ap"</text>
<text x="420" y="870" fill="#cdd6e4" font-size="16">有 apd → APatch 系</text>
<text x="84" y="906" fill="#fbbf24" font-size="15.5">认不出就别猜：装错分支的元模块 = 双挂载，轻则模块失效，重则卡开机</text>
<rect x="60" y="1240" width="700" height="120" rx="14" fill="#1a1520" stroke="#f87171" stroke-width="1.8"/>
<text x="84" y="1276" fill="#f87171" font-size="19" font-weight="bold">三条互斥铁律（违反必翻车）</text>
<text x="84" y="1302" fill="#cbd5e1" font-size="16">1. 一个内核只能有一套 root：Magisk / KSU / APatch 不能共存</text>
<text x="84" y="1328" fill="#cbd5e1" font-size="16">2. 管理器与内核必须同分支同版本协议，跨分支 = 显示「未安装」</text>
<text x="84" y="1354" fill="#cbd5e1" font-size="16">3. Zygisk 实现只能有一套：内置引擎与外挂二选一，双开会抢注入</text>
</svg>